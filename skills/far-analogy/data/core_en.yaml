   motif: space-algebra duality, source: "Swan, Trans. AMS 105 (1962)", source_checked: no}
- {id: A06, name: Stone duality, a: Boolean algebras, b: Stone spaces, status: theorem,
   map: [[ultrafilter, point], [element, clopen set]],
   breaks: "Distributive lattices need spectral spaces (Priestley), not Stone spaces.",
