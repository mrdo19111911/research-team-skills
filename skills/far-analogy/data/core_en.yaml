# ---------- A. Space–algebra duality
- {id: A01, name: Gelfand duality, a: compact Hausdorff spaces, b: commutative unital C*-algebras, status: theorem,
   map: [[point, character / maximal ideal], [continuous function, element], [continuous map, "*-homomorphism (reversed)"]],
   breaks: "Non-compact spaces need non-unital algebras or compactifications; noncommutative algebras have no point set.",
   motif: space-algebra duality, source: "Gelfand–Naimark 1943; Murphy, C*-Algebras and Operator Theory, Thm 2.1.10", source_checked: no}
- {id: A02, name: Gelfand–Naimark representation, a: C*-algebras, b: operator algebras on Hilbert space, status: theorem,
   map: [[abstract C*-algebra, norm-closed *-subalgebra of B(H)]],
   breaks: "Fails for Banach *-algebras without the C*-identity.",
   motif: space-algebra duality, source: "Gelfand–Naimark 1943; Murphy Thm 3.4.1", source_checked: no}
- {id: A03, name: affine schemes and rings, a: affine schemes, b: commutative rings, status: theorem,
   map: [[Spec R, R], [point, prime ideal], [basic open D(f), localization R_f]],
   breaks: "Non-affine schemes are not determined by global sections.",
   motif: space-algebra duality, source: "Hartshorne, Algebraic Geometry, II.2.3", source_checked: no}
- {id: A04, name: Hilbert Nullstellensatz, a: affine varieties, b: radical ideals, status: conditional, hyp: "algebraically closed field",
   map: [[zero set, radical ideal], [point, maximal ideal]],
   breaks: "Over non-closed fields (e.g. R) x^2+1 has no zeros but is not the unit ideal.",
   motif: space-algebra duality, source: "Atiyah–Macdonald, Cor 5.24 / Ex 7.14", source_checked: no}
- {id: A05, name: Serre–Swan, a: vector bundles on compact spaces, b: finitely generated projective modules over function algebras, status: conditional,
   hyp: "X compact Hausdorff (algebraic version: affine varieties)",
   map: [[bundle, module of sections], [Whitney sum, direct sum]],
