   hyp: "theorem for connected simply connected nilpotent Lie groups; heuristic otherwise",
   map: [[orbit, irrep], [orbit measure Fourier transform, character], [projection of orbits, restriction of reps]],
   breaks: "Semisimple groups: integrality conditions and discrete series spoil bijection.",
   motif: quantization, source: "Kirillov, Lectures on the Orbit Method (AMS 2004)", source_checked: no}
