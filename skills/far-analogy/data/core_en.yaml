- {id: C07, name: Mikhalkin correspondence, a: tropical curves, b: complex algebraic curves on toric surfaces, status: conditional,
   hyp: "counting curves through points in general position on toric surfaces",
   map: [[tropical curve counted with multiplicity, complex curve]],
